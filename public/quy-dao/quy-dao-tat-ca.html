<script>
  var PAGEDATA = {"black_hole": "<!DOCTYPE html>\n<html lang=\"vi\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Mô Phỏng Hố Đen 3D Bằng Hạt (GPU WebGL)<\/title>\n    <!-- Tailwind CSS -->\n    <script src=\"https://cdn.tailwindcss.com\"><\/script>\n    <!-- Three.js (r128) -->\n    <script src=\"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js\"><\/script>\n    <!-- Google Fonts -->\n    <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n    <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n    <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap\" rel=\"stylesheet\">\n    <script>\n        tailwind.config = {\n            theme: {\n                extend: {\n                    fontFamily: {\n                        sans: ['Inter', 'sans-serif'],\n                        display: ['Space Grotesk', 'sans-serif'],\n                    }\n                }\n            }\n        };\n    <\/script>\n    <style>\n        html, body {\n            margin: 0;\n            padding: 0;\n            width: 100%;\n            height: 100%;\n            overflow: hidden;\n            background-color: #020308;\n            color: #f8fafc;\n            user-select: none;\n        }\n\n        .glass-panel {\n            background: rgba(10, 14, 28, 0.70);\n            backdrop-filter: blur(14px);\n            -webkit-backdrop-filter: blur(14px);\n            border: 1px solid rgba(148, 163, 184, 0.16);\n            box-shadow: 0 20px 45px -15px rgba(0, 0, 0, 0.8);\n        }\n\n        input[type=\"range\"].cosmic-slider {\n            -webkit-appearance: none;\n            appearance: none;\n            background: rgba(30, 41, 59, 0.9);\n            height: 6px;\n            border-radius: 999px;\n            border: 1px solid rgba(251, 146, 60, 0.28);\n        }\n        input[type=\"range\"].cosmic-slider::-webkit-slider-thumb {\n            -webkit-appearance: none;\n            appearance: none;\n            width: 16px;\n            height: 16px;\n            border-radius: 50%;\n            background: #fb923c;\n            cursor: pointer;\n            box-shadow: 0 0 12px rgba(251, 146, 60, 0.85);\n            transition: transform 0.15s ease;\n        }\n        input[type=\"range\"].cosmic-slider::-webkit-slider-thumb:hover {\n            transform: scale(1.18);\n        }\n\n        #sim-control-panel::-webkit-scrollbar {\n            width: 5px;\n        }\n        #sim-control-panel::-webkit-scrollbar-thumb {\n            background: rgba(148, 163, 184, 0.3);\n            border-radius: 999px;\n        }\n    <\/style>\n<\/head>\n<body class=\"font-sans antialiased\">\n    <!-- Full-viewport 3D WebGL Container -->\n    <div id=\"blackhole-webgl-container\" class=\"fixed inset-0 w-full h-full bg-[#020308] cursor-grab active:cursor-grabbing\"><\/div>\n\n    <!-- Top Header -->\n    <header class=\"fixed top-4 left-4 right-4 z-30 flex items-center justify-between gap-3 pointer-events-none\">\n        <div class=\"glass-panel rounded-2xl px-4 py-3 border border-orange-400/25 pointer-events-auto\">\n            <div class=\"flex items-center gap-2.5\">\n                <span class=\"w-2.5 h-2.5 rounded-full bg-orange-400 animate-pulse\"><\/span>\n                <h1 class=\"font-display font-bold text-sm sm:text-base text-white tracking-wide\">\n                    MÔ PHỎNG HỐ ĐEN 3D BẰNG HẠT (KERR / SCHWARZSCHILD)\n                <\/h1>\n            <\/div>\n            <div class=\"flex flex-wrap items-center gap-2 sm:gap-3 mt-1.5 text-xs font-mono\">\n                <span id=\"sim-particle-badge\" class=\"px-2 py-0.5 rounded bg-orange-500/20 text-orange-300 border border-orange-400/30 font-semibold\">\n                    1,000,000 Particles\n                <\/span>\n                <span id=\"sim-fps-counter\" class=\"px-2 py-0.5 rounded bg-emerald-500/15 text-emerald-300 border border-emerald-400/30\">\n                    -- FPS • GPU WebGL\n                <\/span>\n                <span id=\"sim-target-label\" class=\"text-slate-300 hidden md:inline\">\n                    Góc nhìn: Toàn cảnh Hố Đen & Đĩa Bồi Tụ\n                <\/span>\n            <\/div>\n        <\/div>\n\n        <div class=\"flex items-center gap-2 pointer-events-auto\">\n            <button id=\"download-btn\" title=\"Tải file HTML mô phỏng hố đen\" class=\"glass-panel hover:bg-orange-600/35 border-orange-400/30 text-orange-200 px-3.5 py-2 rounded-full text-xs font-semibold flex items-center gap-1.5 transition cursor-pointer\">\n                <svg class=\"w-4 h-4 text-orange-400\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\" d=\"M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4\"><\/path><\/svg>\n                <span class=\"hidden sm:inline\">Tải HTML<\/span>\n            <\/button>\n            <button id=\"fullscreen-btn\" title=\"Toàn màn hình (F)\" class=\"glass-panel hover:bg-slate-800/80 text-slate-200 p-2 rounded-full transition cursor-pointer\">\n                <svg class=\"w-4 h-4 text-orange-400\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\" d=\"M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4\"><\/path><\/svg>\n            <\/button>\n        <\/div>\n    <\/header>\n\n    <!-- Collapsible Control Panel -->\n    <aside class=\"fixed top-24 right-4 z-30 flex flex-col items-end pointer-events-none\">\n        <button id=\"toggle-sim-panel-btn\" class=\"pointer-events-auto glass-panel hover:bg-slate-800/90 border border-orange-400/35 text-orange-200 px-3.5 py-2 rounded-full text-xs font-semibold flex items-center gap-2 shadow-lg transition cursor-pointer mb-2\">\n            <svg class=\"w-4 h-4 text-orange-400\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\" d=\"M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4\"><\/path><\/svg>\n            <span id=\"toggle-sim-panel-text\">Thu Gọn<\/span>\n        <\/button>\n\n        <div id=\"sim-control-panel\" class=\"pointer-events-auto glass-panel rounded-3xl p-4 sm:p-5 w-72 sm:w-80 border border-orange-500/25 shadow-2xl space-y-4 max-h-[74vh] overflow-y-auto\">\n            <!-- Orbital Speed Control -->\n            <div>\n                <div class=\"flex items-center justify-between text-xs mb-1.5\">\n                    <span class=\"text-slate-300 font-medium\">Tốc độ quay đĩa bồi tụ<\/span>\n                    <span id=\"sim-speed-val\" class=\"font-mono font-bold text-orange-300\">12x<\/span>\n                <\/div>\n                <input id=\"sim-speed-slider\" type=\"range\" min=\"0\" max=\"120\" step=\"1\" value=\"12\" class=\"cosmic-slider w-full\">\n                <div class=\"grid grid-cols-4 gap-1 mt-2\">\n                    <button onclick=\"setSimSpeed(0)\" class=\"text-[11px] py-1 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700 transition cursor-pointer\">Tạm dừng<\/button>\n                    <button onclick=\"setSimSpeed(12)\" class=\"text-[11px] py-1 rounded-lg bg-orange-500/25 text-orange-200 border border-orange-400/50 font-semibold transition cursor-pointer\">12x<\/button>\n                    <button onclick=\"setSimSpeed(40)\" class=\"text-[11px] py-1 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700 transition cursor-pointer\">40x<\/button>\n                    <button onclick=\"setSimSpeed(90)\" class=\"text-[11px] py-1 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700 transition cursor-pointer\">90x<\/button>\n                <\/div>\n            <\/div>\n\n            <!-- Particle Count Selector (250K / 500K / 1M / 2M+) -->\n            <div class=\"pt-2 border-t border-slate-700/60\">\n                <div class=\"flex items-center justify-between text-xs mb-1.5\">\n                    <span class=\"text-slate-300 font-medium\">Số lượng hạt mô phỏng<\/span>\n                    <span id=\"sim-particle-label\" class=\"font-mono font-bold text-orange-300\">1,000,000<\/span>\n                <\/div>\n                <div class=\"grid grid-cols-4 gap-1\">\n                    <button onclick=\"setParticleCount(250000)\" data-pcount=\"250000\" class=\"pcount-btn text-[11px] py-1.5 rounded-lg bg-slate-800/80 hover:bg-orange-500/25 text-slate-300 border border-slate-700 font-mono transition cursor-pointer\">250K<\/button>\n                    <button onclick=\"setParticleCount(500000)\" data-pcount=\"500000\" class=\"pcount-btn text-[11px] py-1.5 rounded-lg bg-slate-800/80 hover:bg-orange-500/25 text-slate-300 border border-slate-700 font-mono transition cursor-pointer\">500K<\/button>\n                    <button onclick=\"setParticleCount(1000000)\" data-pcount=\"1000000\" class=\"pcount-btn text-[11px] py-1.5 rounded-lg bg-orange-500/25 text-orange-200 border border-orange-400/50 font-mono font-semibold transition cursor-pointer\">1M<\/button>\n                    <button onclick=\"setParticleCount(2000000)\" data-pcount=\"2000000\" class=\"pcount-btn text-[11px] py-1.5 rounded-lg bg-slate-800/80 hover:bg-purple-500/25 text-purple-200 border border-purple-400/40 font-mono transition cursor-pointer\">2M+<\/button>\n                <\/div>\n                <p class=\"text-[10px] text-slate-400 mt-1.5 leading-snug\">\n                    Mức <span class=\"text-purple-300 font-semibold\">2M+<\/span> tăng mật độ tia tương đối tính, vành photon uốn cong & sao bị hút xoắn ốc.\n                <\/p>\n            <\/div>\n\n            <!-- Gravitational Lensing / Warp Strength -->\n            <div class=\"pt-2 border-t border-slate-700/60\">\n                <div class=\"flex items-center justify-between text-xs mb-1.5\">\n                    <span class=\"text-slate-300 font-medium\">Thấu kính hấp dẫn & Lật sáng<\/span>\n                    <span id=\"sim-lens-val\" class=\"font-mono font-bold text-amber-300\">100%<\/span>\n                <\/div>\n                <input id=\"sim-lens-slider\" type=\"range\" min=\"0\" max=\"150\" step=\"1\" value=\"100\" class=\"cosmic-slider w-full\">\n                <div class=\"flex justify-between text-[10px] text-slate-400 mt-1\">\n                    <span>Phẳng cơ bản<\/span>\n                    <span>Uốn cong không-thời gian<\/span>\n                <\/div>\n            <\/div>\n\n            <!-- Camera Focus Presets -->\n            <div class=\"pt-2 border-t border-slate-700/60\">\n                <div class=\"text-xs text-slate-300 font-medium mb-2\">Tiêu điểm Camera (Focus)<\/div>\n                <div class=\"grid grid-cols-2 gap-1.5\">\n                    <button onclick=\"focusBlackHoleTarget('overview')\" data-focus=\"overview\" class=\"focus-btn col-span-2 text-left px-3 py-1.5 rounded-xl bg-orange-500/25 border border-orange-400/50 text-orange-200 text-xs font-semibold transition cursor-pointer\">\n                        🕳️ Toàn cảnh Hố Đen & Đĩa Bồi Tụ\n                    <\/button>\n                    <button onclick=\"focusBlackHoleTarget('horizon')\" data-focus=\"horizon\" class=\"focus-btn text-left px-2.5 py-1.5 rounded-xl bg-slate-800/75 hover:bg-slate-700/80 border border-slate-700 text-slate-200 text-xs transition cursor-pointer\">\n                        ⚫ Chân Trời Sự Kiện\n                    <\/button>\n                    <button onclick=\"focusBlackHoleTarget('photon')\" data-focus=\"photon\" class=\"focus-btn text-left px-2.5 py-1.5 rounded-xl bg-slate-800/75 hover:bg-slate-700/80 border border-slate-700 text-slate-200 text-xs transition cursor-pointer\">\n                        💫 Vành Photon Sáng\n                    <\/button>\n                    <button onclick=\"focusBlackHoleTarget('disk')\" data-focus=\"disk\" class=\"focus-btn text-left px-2.5 py-1.5 rounded-xl bg-slate-800/75 hover:bg-slate-700/80 border border-slate-700 text-slate-200 text-xs transition cursor-pointer\">\n                        🔥 Dòng Khí Nóng Bồi Tụ\n                    <\/button>\n                    <button onclick=\"focusBlackHoleTarget('jets')\" data-focus=\"jets\" class=\"focus-btn text-left px-2.5 py-1.5 rounded-xl bg-slate-800/75 hover:bg-slate-700/80 border border-slate-700 text-slate-200 text-xs transition cursor-pointer\">\n                        ⚡ Tia Plasma Hai Cực\n                    <\/button>\n                <\/div>\n            <\/div>\n\n            <!-- Particle Allocation Breakdown -->\n            <div class=\"pt-2 border-t border-slate-700/60 text-[11px] text-slate-400 space-y-1\">\n                <div class=\"flex justify-between\"><span>• Chân trời sự kiện & Vành Photon:<\/span><span id=\"bd-horizon\" class=\"text-amber-300 font-mono\">120,000<\/span><\/div>\n                <div class=\"flex justify-between\"><span>• Đĩa bồi tụ xoắn ốc & Doppler:<\/span><span id=\"bd-disk\" class=\"text-orange-300 font-mono\">460,000<\/span><\/div>\n                <div class=\"flex justify-between\"><span>• Ánh sáng đĩa uốn cong phía sau:<\/span><span id=\"bd-lensed\" class=\"text-yellow-200 font-mono\">180,000<\/span><\/div>\n                <div class=\"flex justify-between\"><span>• Dòng vật chất rơi & Tia cực:<\/span><span id=\"bd-jets\" class=\"text-cyan-300 font-mono\">140,000<\/span><\/div>\n                <div class=\"flex justify-between\"><span>• Sao nền & Bụi ngân hà:<\/span><span id=\"bd-stars\" class=\"text-purple-300 font-mono\">100,000<\/span><\/div>\n            <\/div>\n        <\/div>\n    <\/aside>\n\n    <!-- Bottom Controls Hint -->\n    <footer class=\"fixed bottom-3 left-1/2 -translate-x-1/2 z-30 pointer-events-none\">\n        <div class=\"px-4 py-1.5 rounded-full bg-slate-950/75 border border-slate-800 text-[11px] text-slate-400 backdrop-blur-md whitespace-nowrap\">\n            Chuột trái: Xoay 360° • Lăn chuột / Chụm ngón: Zoom • Chuột phải: Di chuyển • Phím F: Toàn màn hình\n        <\/div>\n    <\/footer>\n\n    <!-- Toast Notification -->\n    <div id=\"toast-notification\" class=\"fixed bottom-14 right-4 z-50 glass-panel border-orange-400/40 text-orange-100 px-4 py-2.5 rounded-2xl shadow-2xl transform translate-x-full opacity-0 transition-all duration-300 flex items-center gap-2.5 text-xs\">\n        <span class=\"w-2 h-2 rounded-full bg-orange-400\"><\/span>\n        <span id=\"toast-message\">Thông báo<\/span>\n    <\/div>\n\n    <script>\n        /* -----------------------------------------------------------\n           UI UTILITIES: TOAST, FULLSCREEN & DOWNLOAD\n        ----------------------------------------------------------- */\n        function showToast(message) {\n            const toast = document.getElementById('toast-notification');\n            const toastMsg = document.getElementById('toast-message');\n            if (!toast || !toastMsg) return;\n            toastMsg.textContent = message;\n            toast.classList.remove('translate-x-full', 'opacity-0');\n            setTimeout(() => {\n                toast.classList.add('translate-x-full', 'opacity-0');\n            }, 3000);\n        }\n\n        function toggleFullScreen() {\n            if (!document.fullscreenElement) {\n                document.documentElement.requestFullscreen().catch(() => {\n                    showToast('Trình duyệt không hỗ trợ chế độ toàn màn hình ở khung này.');\n                });\n            } else if (document.exitFullscreen) {\n                document.exitFullscreen();\n            }\n        }\n        document.getElementById('fullscreen-btn').addEventListener('click', toggleFullScreen);\n        document.addEventListener('keydown', (e) => {\n            if (e.key.toLowerCase() === 'f') toggleFullScreen();\n        });\n\n        document.getElementById('download-btn').addEventListener('click', () => {\n            try {\n                const htmlContent = '<!DOCTYPE html>\\n' + document.documentElement.outerHTML;\n                const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });\n                const url = URL.createObjectURL(blob);\n                const a = document.createElement('a');\n                a.href = url;\n                a.download = 'Mo_Phong_Ho_Den_3D.html';\n                document.body.appendChild(a);\n                a.click();\n                document.body.removeChild(a);\n                URL.revokeObjectURL(url);\n                showToast('Đã tải xuống file mô phỏng hố đen 3D thành công!');\n            } catch (err) {\n                showToast('Không thể tải trực tiếp, hãy nhấn Ctrl+S để lưu trang.');\n            }\n        });\n\n        /* -----------------------------------------------------------\n           3D PARTICLE BLACK HOLE ENGINE (THREE.JS + CUSTOM GLSL)\n        ----------------------------------------------------------- */\n        let bhScene, bhCamera, bhRenderer, bhSolidMat, bhGlowMat;\n        let bhPointsObjects = [];\n        let bhParticleCount = 1000000;\n        let bhTime = 0.0;\n        let bhSpeed = 12.0;\n        let bhLensStrength = 1.0;\n        let bhFocusTarget = 'overview';\n\n        const EVENT_HORIZON_R = 6.4;\n        const PHOTON_SPHERE_R = 7.3;\n\n        const camState = {\n            theta: 0.42,\n            phi: 1.28,\n            radius: 56,\n            targetRadius: 56,\n            targetTheta: 0.42,\n            targetPhi: 1.28,\n            lookAt: new THREE.Vector3(0, 0, 0),\n            panOffset: new THREE.Vector3(0, 0, 0),\n            isDragging: false,\n            isPanning: false,\n            prevX: 0,\n            prevY: 0,\n            pinchDist: 0\n        };\n\n        document.getElementById('toggle-sim-panel-btn').addEventListener('click', () => {\n            const panel = document.getElementById('sim-control-panel');\n            const label = document.getElementById('toggle-sim-panel-text');\n            panel.classList.toggle('hidden');\n            label.textContent = panel.classList.contains('hidden') ? 'Mở Điều Khiển' : 'Thu Gọn';\n        });\n\n        const simSpeedSlider = document.getElementById('sim-speed-slider');\n        const simSpeedVal = document.getElementById('sim-speed-val');\n        function setSimSpeed(val) {\n            bhSpeed = parseFloat(val);\n            if (simSpeedSlider) simSpeedSlider.value = bhSpeed;\n            if (simSpeedVal) simSpeedVal.textContent = bhSpeed === 0 ? 'Tạm dừng' : `${bhSpeed}x`;\n        }\n        if (simSpeedSlider) {\n            simSpeedSlider.addEventListener('input', (e) => setSimSpeed(e.target.value));\n        }\n\n        const simLensSlider = document.getElementById('sim-lens-slider');\n        const simLensVal = document.getElementById('sim-lens-val');\n        if (simLensSlider) {\n            simLensSlider.addEventListener('input', (e) => {\n                const pct = parseFloat(e.target.value);\n                bhLensStrength = pct / 100.0;\n                if (simLensVal) simLensVal.textContent = `${Math.round(pct)}%`;\n            });\n        }\n\n        function focusBlackHoleTarget(targetKey) {\n            bhFocusTarget = targetKey;\n            camState.panOffset.set(0, 0, 0);\n\n            const presets = {\n                overview: { r: 56, phi: 1.28, label: `Toàn cảnh Hố Đen (${bhParticleCount.toLocaleString('en-US')} Hạt)` },\n                horizon:  { r: 15.5, phi: 1.46, label: 'Chân Trời Sự Kiện (Event Horizon)' },\n                photon:   { r: 19.5, phi: 1.42, label: 'Vành Photon & Thấu Kính Hấp Dẫn' },\n                disk:     { r: 34, phi: 1.14, label: 'Đĩa Bồi Tụ Khí Nóng Xoắn Ốc' },\n                jets:     { r: 58, phi: 1.42, label: 'Tia Plasma Tương Đối Tính Hai Cực' }\n            };\n\n            const cfg = presets[targetKey] || presets.overview;\n            camState.targetRadius = cfg.r;\n            camState.targetPhi = cfg.phi;\n\n            const labelEl = document.getElementById('sim-target-label');\n            if (labelEl) labelEl.textContent = `Góc nhìn: ${cfg.label}`;\n\n            document.querySelectorAll('.focus-btn').forEach(btn => {\n                if (btn.getAttribute('data-focus') === targetKey) {\n                    btn.classList.remove('bg-slate-800/75', 'border-slate-700', 'text-slate-200');\n                    btn.classList.add('bg-orange-500/25', 'border-orange-400/50', 'text-orange-200', 'font-semibold');\n                } else {\n                    btn.classList.remove('bg-orange-500/25', 'border-orange-400/50', 'text-orange-200', 'font-semibold');\n                    btn.classList.add('bg-slate-800/75', 'border-slate-700', 'text-slate-200');\n                }\n            });\n        }\n\n        function updateParticleUI(totalCount) {\n            const badgeEl = document.getElementById('sim-particle-badge');\n            const labelEl = document.getElementById('sim-particle-label');\n            if (badgeEl) badgeEl.textContent = `${totalCount.toLocaleString('en-US')} Particles`;\n            if (labelEl) labelEl.textContent = totalCount.toLocaleString('en-US');\n\n            document.querySelectorAll('.pcount-btn').forEach(btn => {\n                const val = parseInt(btn.getAttribute('data-pcount'), 10);\n                btn.classList.remove(\n                    'bg-orange-500/25', 'text-orange-200', 'border-orange-400/50', 'font-semibold',\n                    'bg-purple-500/25', 'text-purple-200', 'border-purple-400/40'\n                );\n                btn.classList.add('bg-slate-800/80', 'text-slate-300', 'border-slate-700');\n\n                if (val === totalCount) {\n                    if (val >= 2000000) {\n                        btn.classList.remove('bg-slate-800/80', 'text-slate-300', 'border-slate-700');\n                        btn.classList.add('bg-purple-500/25', 'text-purple-200', 'border-purple-400/40', 'font-semibold');\n                    } else {\n                        btn.classList.remove('bg-slate-800/80', 'text-slate-300', 'border-slate-700');\n                        btn.classList.add('bg-orange-500/25', 'text-orange-200', 'border-orange-400/50', 'font-semibold');\n                    }\n                }\n            });\n\n            const ratio = totalCount / 1000000;\n            const hN = Math.round(120000 * ratio);\n            const dN = Math.round(460000 * ratio);\n            const lN = Math.round(180000 * ratio);\n            const jN = Math.round(140000 * ratio);\n            const sN = Math.max(0, totalCount - (hN + dN + lN + jN));\n\n            const setText = (id, v) => {\n                const el = document.getElementById(id);\n                if (el) el.textContent = v.toLocaleString('en-US');\n            };\n            setText('bd-horizon', hN);\n            setText('bd-disk', dN);\n            setText('bd-lensed', lN);\n            setText('bd-jets', jN);\n            setText('bd-stars', sN);\n        }\n\n        function setParticleCount(newCount) {\n            if (![250000, 500000, 1000000, 2000000].includes(newCount)) return;\n            bhParticleCount = newCount;\n            updateParticleUI(bhParticleCount);\n            buildBlackHole(bhParticleCount);\n            showToast(`Đã chuyển mô phỏng hố đen sang ${bhParticleCount.toLocaleString('en-US')} hạt!`);\n        }\n\n        function clearBlackHoleObjects() {\n            if (bhScene && bhPointsObjects.length > 0) {\n                bhPointsObjects.forEach(obj => {\n                    bhScene.remove(obj.points);\n                    if (obj.geometry) obj.geometry.dispose();\n                    if (obj.material) obj.material.dispose();\n                });\n            }\n            bhPointsObjects = [];\n        }\n\n        function buildBlackHole(totalParticles) {\n            const container = document.getElementById('blackhole-webgl-container');\n            if (!container) return;\n\n            const width = container.clientWidth || window.innerWidth;\n            const height = container.clientHeight || window.innerHeight;\n\n            if (!bhScene) {\n                bhScene = new THREE.Scene();\n                bhScene.background = new THREE.Color(0x020308);\n            }\n\n            if (!bhCamera) {\n                bhCamera = new THREE.PerspectiveCamera(48, width / height, 0.1, 3500);\n            }\n\n            const maxPr = totalParticles >= 2000000 ? 1.25 : 1.75;\n            if (!bhRenderer) {\n                bhRenderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });\n                bhRenderer.setSize(width, height);\n                bhRenderer.setPixelRatio(Math.min(window.devicePixelRatio, maxPr));\n                container.innerHTML = '';\n                container.appendChild(bhRenderer.domElement);\n                attachCameraControls(bhRenderer.domElement, container);\n            } else {\n                bhRenderer.setPixelRatio(Math.min(window.devicePixelRatio, maxPr));\n            }\n\n            clearBlackHoleObjects();\n            updateParticleUI(totalParticles);\n\n            const ratio = totalParticles / 1000000;\n            const is2M = totalParticles >= 2000000;\n\n            const SOLID_COUNT = Math.round(560000 * ratio);\n            const GLOW_COUNT  = Math.max(4000, totalParticles - SOLID_COUNT);\n\n            function createLayer(count) {\n                return {\n                    positions: new Float32Array(count * 3),\n                    colors:    new Float32Array(count * 3),\n                    // meta1: [pType, pSize, phase, radiusOrDist]\n                    // meta2: [angSpeed, radialBiasOrTilt, arm, heatOrAlpha]\n                    meta1: new Float32Array(count * 4),\n                    meta2: new Float32Array(count * 4),\n                    ptr: 0\n                };\n            }\n\n            const solid = createLayer(SOLID_COUNT);\n            const glow  = createLayer(GLOW_COUNT);\n\n            let seed = 987654321 + totalParticles;\n            function rand() {\n                seed = (seed * 1664525 + 1013904223) % 4294967296;\n                return seed / 4294967296;\n            }\n            function randGauss() {\n                return (rand() + rand() + rand() - 1.5) * 1.33;\n            }\n\n            function pushP(layer, px, py, pz, cr, cg, cb, pType, pSize, phase, radOrDist, angSpeed, thickOrTilt, arm, extra) {\n                if (layer.ptr >= layer.positions.length / 3) return;\n                const i3 = layer.ptr * 3;\n                const i4 = layer.ptr * 4;\n\n                layer.positions[i3]     = px;\n                layer.positions[i3 + 1] = py;\n                layer.positions[i3 + 2] = pz;\n\n                layer.colors[i3]     = cr;\n                layer.colors[i3 + 1] = cg;\n                layer.colors[i3 + 2] = cb;\n\n                layer.meta1[i4]     = pType;\n                layer.meta1[i4 + 1] = pSize;\n                layer.meta1[i4 + 2] = phase;\n                layer.meta1[i4 + 3] = radOrDist;\n\n                layer.meta2[i4]     = angSpeed;\n                layer.meta2[i4 + 1] = thickOrTilt;\n                layer.meta2[i4 + 2] = arm;\n                layer.meta2[i4 + 3] = extra;\n\n                layer.ptr++;\n            }\n\n            // 1. EVENT HORIZON SHADOW CORE\n            const horizonCount = Math.min(Math.round(82000 * ratio), Math.max(0, SOLID_COUNT - solid.ptr - 10000));\n            const goldenRatio = (1.0 + Math.sqrt(5.0)) / 2.0;\n            for (let i = 0; i < horizonCount; i++) {\n                const y = 1.0 - (i / Math.max(1, horizonCount - 1)) * 2.0;\n                const rAtY = Math.sqrt(Math.max(0.0, 1.0 - y * y));\n                const theta = (2.0 * Math.PI * i) / goldenRatio;\n\n                const nx = Math.cos(theta) * rAtY;\n                const ny = y;\n                const nz = Math.sin(theta) * rAtY;\n                const rCore = EVENT_HORIZON_R * (0.96 + 0.04 * (i % 5) / 4.0);\n\n                pushP(\n                    solid,\n                    nx * rCore, ny * rCore, nz * rCore,\n                    0.002, 0.002, 0.005,\n                    0.0, 1.45, theta, rCore,\n                    0.0, 0.0, 0.0, 0.0\n                );\n            }\n\n            // 2. EQUATORIAL ACCRETION DISK (Continuous smooth distribution, no ring banding)\n            const diskTarget = Math.round(480000 * ratio);\n            const diskCount = Math.min(diskTarget, Math.max(0, SOLID_COUNT - solid.ptr));\n            for (let i = 0; i < diskCount; i++) {\n                const t = Math.pow(rand(), 1.65);\n                const rDist = EVENT_HORIZON_R * 1.16 + t * 29.5;\n                const angle = rand() * Math.PI * 2.0;\n                const spiralArm = Math.sin(angle * 2.0 - Math.log(rDist) * 3.8) * 0.5 + 0.5 * Math.cos(angle * 3.0 + rDist * 0.25);\n\n                const halfThick = 0.05 + Math.pow(t, 1.35) * 0.45 + spiralArm * 0.04;\n                const yOff = randGauss() * halfThick;\n                const angSpeed = 11.5 / Math.pow(rDist / EVENT_HORIZON_R, 1.42);\n\n                const innerBoost = Math.exp(-Math.pow((rDist - EVENT_HORIZON_R * 1.20) / 3.8, 2.0));\n                const heat = Math.max(0.0, Math.min(1.0, (1.0 - t * 0.92) * 0.84 + innerBoost * 0.32 + spiralArm * 0.05));\n                const cr = Math.min(1.0, 0.44 + 0.56 * Math.pow(heat, 0.72));\n                const cg = Math.min(1.0, 0.10 + 0.60 * Math.pow(heat, 1.30) + 0.25 * Math.pow(heat, 3.0));\n                const cb = Math.min(1.0, 0.03 + 0.75 * Math.pow(heat, 2.8));\n\n                pushP(\n                    solid,\n                    Math.cos(angle) * rDist, yOff, Math.sin(angle) * rDist,\n                    cr, cg, cb,\n                    1.0, 0.96 + heat * 0.42, angle, rDist,\n                    angSpeed, yOff, spiralArm, heat\n                );\n            }\n\n            while (solid.ptr < SOLID_COUNT) {\n                const rDist = EVENT_HORIZON_R * 1.18 + Math.pow(rand(), 1.8) * 24.0;\n                const angle = rand() * Math.PI * 2.0;\n                const yOff = randGauss() * 0.15;\n                const angSpeed = 11.5 / Math.pow(rDist / EVENT_HORIZON_R, 1.42);\n                pushP(solid, Math.cos(angle) * rDist, yOff, Math.sin(angle) * rDist, 1.0, 0.56, 0.18, 1.0, 1.05, angle, rDist, angSpeed, yOff, 0.0, 0.72);\n            }\n\n            // 3. PHOTON SPHERE RING (Soft continuous bright ring hugging the shadow edge)\n            const photonCount = Math.round(70000 * ratio);\n            for (let i = 0; i < photonCount; i++) {\n                const theta = rand() * Math.PI * 2.0;\n                const spread = randGauss() * 0.22;\n                const rPh = PHOTON_SPHERE_R + spread * 0.55;\n                const px = rPh * Math.cos(theta);\n                const py = randGauss() * 0.22;\n                const pz = rPh * Math.sin(theta);\n\n                const falloff = Math.exp(-Math.abs(spread) * 1.4);\n                pushP(glow, px, py, pz, 1.0 * falloff, 0.85 * falloff, 0.60 * falloff, 3.0, 1.15, theta, rPh, 14.0, spread, 0.0, falloff);\n            }\n\n            // 4. CONTINUOUS GRAVITATIONALLY LENSED HALO (Unified smooth arch over & under the black hole)\n            const lensedCount = Math.round(225000 * ratio);\n            for (let i = 0; i < lensedCount; i++) {\n                // Continuous radial falloff from inner halo (near photon sphere) outward\n                const uRad = Math.pow(rand(), 1.85);\n                const haloThick = 0.35 + uRad * 8.5;\n                const polarAngle = (rand() - 0.5) * Math.PI * 1.85;\n                const isTop = rand() < 0.52;\n                const signY = isTop ? 1.0 : -1.0;\n\n                // Smoothly wrap around the black hole silhouette like a real lensed accretion canopy\n                const archR = PHOTON_SPHERE_R * 1.02 + uRad * 7.8 + randGauss() * 0.55;\n                const lx = Math.sin(polarAngle) * (archR * 1.04) + randGauss() * 0.35;\n                const ly = signY * Math.cos(polarAngle) * (archR * 0.98) + randGauss() * (0.25 + uRad * 0.65);\n                const lz = -Math.pow(Math.max(0.0, Math.cos(polarAngle)), 1.4) * 1.5 + randGauss() * (0.35 + haloThick * 0.14);\n\n                const heat = Math.max(0.0, Math.min(1.0, (1.0 - uRad) * (0.55 + 0.45 * Math.abs(Math.cos(polarAngle)))));\n                const cr = 1.0;\n                const cg = 0.18 + 0.62 * Math.pow(heat, 1.25);\n                const cb = 0.04 + 0.62 * Math.pow(heat, 2.5);\n                const alphaWeight = (1.0 - uRad * 0.72) * 0.75;\n\n                pushP(\n                    glow,\n                    lx, ly, lz,\n                    cr * alphaWeight, cg * alphaWeight, cb * alphaWeight,\n                    2.0, 1.15 + heat * 0.35, polarAngle, archR,\n                    4.5 / (1.0 + uRad * 2.5), signY, uRad, heat\n                );\n            }\n\n            // 5. SUBTLE RELATIVISTIC JETS & INNER INFALLING WISPS\n            const jetCount = Math.round((is2M ? 85000 : 65000) * ratio);\n            for (let i = 0; i < jetCount; i++) {\n                const isPolarJet = i < jetCount * 0.45;\n                if (isPolarJet) {\n                    const poleSign = rand() < 0.5 ? 1.0 : -1.0;\n                    const hProg = Math.pow(rand(), 1.15);\n                    const yJet = poleSign * (EVENT_HORIZON_R * 1.08 + hProg * 28.0);\n                    const coneRadius = 0.12 + Math.pow(hProg, 1.4) * 1.45;\n                    const ang = rand() * Math.PI * 2.0;\n                    const radOff = Math.pow(rand(), 0.8) * coneRadius;\n\n                    const fade = Math.max(0.02, (1.0 - hProg * 0.92) * 0.28);\n                    pushP(\n                        glow,\n                        Math.cos(ang) * radOff, yJet, Math.sin(ang) * radOff,\n                        0.45 * fade, 0.70 * fade, 1.0 * fade,\n                        4.0, 0.85, ang, radOff, 5.0 * poleSign, poleSign, hProg, fade\n                    );\n                } else {\n                    const sProg = Math.pow(rand(), 1.35);\n                    const rIn = EVENT_HORIZON_R * 1.08 + sProg * 14.0;\n                    const ang = rand() * Math.PI * 2.0;\n                    const yIn = randGauss() * (0.08 + sProg * 0.42);\n                    const wFade = (1.0 - sProg * 0.55) * 0.72;\n\n                    pushP(\n                        glow,\n                        Math.cos(ang) * rIn, yIn, Math.sin(ang) * rIn,\n                        0.98 * wFade, 0.48 * wFade, 0.16 * wFade,\n                        4.0, 0.9, ang, rIn,\n                        14.0 / Math.pow(rIn / EVENT_HORIZON_R, 1.5), yIn, 1.0, 1.0 - sProg\n                    );\n                }\n            }\n\n            // 6. BACKGROUND STARFIELD & MILKY WAY BAND\n            while (glow.ptr < GLOW_COUNT) {\n                const isBand = rand() < 0.52;\n                const R = 750.0 + rand() * 550.0;\n                let sx, sy, sz;\n\n                if (isBand) {\n                    const lon = rand() * Math.PI * 2.0;\n                    const lat = randGauss() * 0.15;\n                    const bx = R * Math.cos(lat) * Math.cos(lon);\n                    const by = R * Math.sin(lat);\n                    const bz = R * Math.cos(lat) * Math.sin(lon);\n                    const tilt = 0.48;\n                    sx = bx * Math.cos(tilt) - by * Math.sin(tilt);\n                    sy = bx * Math.sin(tilt) + by * Math.cos(tilt);\n                    sz = bz;\n                } else {\n                    const theta = rand() * Math.PI * 2.0;\n                    const phi = Math.acos(2.0 * rand() - 1.0);\n                    sx = R * Math.sin(phi) * Math.cos(theta);\n                    sy = R * Math.cos(phi);\n                    sz = R * Math.sin(phi) * Math.sin(theta);\n                }\n\n                const mag = isBand ? (0.20 + rand() * 0.32) : (0.42 + rand() * 0.52);\n                pushP(glow, sx, sy, sz, 0.85 * mag, 0.90 * mag, 1.0 * mag, 5.0, 1.3 + rand() * 1.0, rand() * 6.283, R, 0.0, 0.0, 0.0, 0.0);\n            }\n\n            const vertexShaderSrc = `\n                attribute vec3 aColor;\n                attribute vec4 aMeta1; // [pType, pSize, phase, radOrDist]\n                attribute vec4 aMeta2; // [angSpeed, thickOrTilt, arm, extra]\n\n                uniform float uTime;\n                uniform float uLensStrength;\n                uniform float uPixelRatio;\n\n                varying vec3 vColor;\n                varying float vType;\n\n                void main() {\n                    float pType = aMeta1.x;\n                    float pSize = aMeta1.y;\n                    float phase = aMeta1.z;\n                    float radOrDist = aMeta1.w;\n\n                    float angSpeed = aMeta2.x;\n                    float thickOrTilt = aMeta2.y;\n                    float arm = aMeta2.z;\n                    float extra = aMeta2.w;\n\n                    vec3 pos = position;\n                    vec3 col = aColor;\n\n                    if (pType < 0.5) {\n                        float rot = uTime * 0.25;\n                        float c = cos(rot);\n                        float s = sin(rot);\n                        pos.xz = mat2(c, -s, s, c) * pos.xz;\n                        col = vec3(0.001, 0.001, 0.003);\n                    } else if (pType < 1.5) {\n                        float ang = phase + uTime * angSpeed;\n                        float r = radOrDist;\n                        float waveY = sin(ang * 2.0 - r * 0.32 + uTime * 1.8) * 0.06 * uLensStrength;\n                        pos = vec3(cos(ang) * r, thickOrTilt + waveY, sin(ang) * r);\n\n                        float doppler = clamp(-sin(ang) * 0.5 + 0.5, 0.0, 1.0);\n                        float boost = mix(0.72, 1.32, pow(doppler, 1.2) * uLensStrength);\n                        col = aColor * boost;\n                    } else if (pType < 2.5) {\n                        // Gentle organic drift along the lensed canopy without forming discrete rings\n                        float drift = sin(uTime * 1.6 + phase * 3.0) * 0.06 * uLensStrength;\n                        float warpScale = mix(0.25, 1.08, uLensStrength);\n                        pos = vec3(\n                            position.x * warpScale + drift,\n                            position.y * warpScale - drift * 0.5,\n                            position.z * warpScale\n                        );\n                        col = aColor * (0.45 + 0.68 * uLensStrength);\n                    } else if (pType < 3.5) {\n                        float ang = phase + uTime * angSpeed;\n                        float r = radOrDist;\n                        pos = vec3(r * cos(ang), thickOrTilt * 0.35, r * sin(ang));\n                        col = aColor * (0.75 + 0.45 * uLensStrength);\n                    } else if (pType < 4.5) {\n                        if (arm > 0.5) {\n                            float rNow = max(${EVENT_HORIZON_R.toFixed(1)}, radOrDist - mod(uTime * 3.5, 8.0) * extra);\n                            float angNow = phase + uTime * angSpeed * (8.5 / max(6.0, rNow));\n                            pos = vec3(cos(angNow) * rNow, thickOrTilt * (rNow / max(6.0, radOrDist)), sin(angNow) * rNow);\n                        } else {\n                            float ang = phase + uTime * angSpeed * 0.5;\n                            pos = vec3(cos(ang) * radOrDist, position.y, sin(ang) * radOrDist);\n                        }\n                    } else {\n                        vec3 toCam = normalize(cameraPosition - pos);\n                        vec3 bhDir = normalize(-pos);\n                        float align = max(0.0, dot(normalize(pos), normalize(-cameraPosition)));\n                        float deflection = pow(align, 18.0) * 95.0 * uLensStrength;\n                        pos += cross(bhDir, toCam) * deflection;\n                    }\n\n                    vColor = col;\n                    vType = pType;\n\n                    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);\n                    gl_Position = projectionMatrix * mvPosition;\n\n                    float distToCam = max(1.0, -mvPosition.z);\n                    float sizeScale = (pType > 4.5) ? 1.45 : (52.0 / distToCam);\n                    float maxPt = (${totalParticles} >= 2000000) ? 5.2 : 7.5;\n                    float minPt = (pType < 0.5) ? 2.5 : ((pType > 4.5) ? 0.80 : 0.95);\n                    gl_PointSize = clamp(pSize * sizeScale * uPixelRatio, minPt, maxPt);\n                }\n            `;\n\n            const solidFragSrc = `\n                varying vec3 vColor;\n                varying float vType;\n                void main() {\n                    vec2 coord = gl_PointCoord - vec2(0.5);\n                    float rSq = dot(coord, coord);\n                    if (rSq > 0.25) discard;\n                    float alpha = (vType < 0.5) ? 1.0 : smoothstep(0.25, 0.06, rSq);\n                    gl_FragColor = vec4(vColor, alpha);\n                }\n            `;\n\n            const glowFragSrc = `\n                varying vec3 vColor;\n                varying float vType;\n                void main() {\n                    vec2 coord = gl_PointCoord - vec2(0.5);\n                    float rSq = dot(coord, coord);\n                    if (rSq > 0.25) discard;\n                    float glow = smoothstep(0.25, 0.0, rSq);\n                    float alpha = (vType > 4.5) ? glow * 0.34 : glow * 0.28;\n                    gl_FragColor = vec4(vColor * glow, alpha);\n                }\n            `;\n\n            function addLayerMesh(layer, fragSrc, blending, depthWrite) {\n                const geom = new THREE.BufferGeometry();\n                geom.setAttribute('position', new THREE.BufferAttribute(layer.positions, 3));\n                geom.setAttribute('aColor',   new THREE.BufferAttribute(layer.colors, 3));\n                geom.setAttribute('aMeta1',   new THREE.BufferAttribute(layer.meta1, 4));\n                geom.setAttribute('aMeta2',   new THREE.BufferAttribute(layer.meta2, 4));\n\n                const mat = new THREE.ShaderMaterial({\n                    uniforms: {\n                        uTime:         { value: bhTime },\n                        uLensStrength: { value: bhLensStrength },\n                        uPixelRatio:   { value: Math.min(window.devicePixelRatio, 2) }\n                    },\n                    vertexShader: vertexShaderSrc,\n                    fragmentShader: fragSrc,\n                    transparent: true,\n                    depthWrite: depthWrite,\n                    blending: blending\n                });\n\n                const pts = new THREE.Points(geom, mat);\n                pts.frustumCulled = false;\n                bhScene.add(pts);\n                bhPointsObjects.push({ points: pts, geometry: geom, material: mat });\n                return mat;\n            }\n\n            bhSolidMat = addLayerMesh(solid, solidFragSrc, THREE.NormalBlending, true);\n            bhGlowMat  = addLayerMesh(glow,  glowFragSrc,  THREE.AdditiveBlending, false);\n        }\n\n        function attachCameraControls(domEl, container) {\n            domEl.addEventListener('mousedown', (e) => {\n                if (e.button === 2 || e.shiftKey) camState.isPanning = true;\n                else camState.isDragging = true;\n                camState.prevX = e.clientX;\n                camState.prevY = e.clientY;\n            });\n\n            window.addEventListener('mouseup', () => {\n                camState.isDragging = false;\n                camState.isPanning            if (e.touches.length === 1 && camState.isDragging) {\n                    const dx = e.touches[0].clientX - camState.prevX;\n                    const dy = e.touches[0].clientY - camState.prevY;\n                    camState.prevX = e.touches[0].clientX;\n                    camState.prevY = e.touches[0].clientY;\n                    camState.targetTheta -= dx * 0.008;\n                    camState.targetPhi = Math.max(0.06, Math.min(Math.PI - 0.06, camState.targetPhi - dy * 0.008));\n                } else if (e.touches.length === 2) {\n                    const dx = e.touches[0].clientX - e.touches[1].clientX;\n                    const dy = e.touches[0].clientY - e.touches[1].clientY;\n                    const newDist = Math.hypot(dx, dy);\n                    if (camState.pinchDist > 0) {\n                        const scale = camState.pinchDist / newDist;\n                        camState.targetRadius = Math.max(9.5, Math.min(260, camState.targetRadius * scale));\n                    }\n                    camState.pinchDist = newDist;\n                }\n            }, { passive: true });\n\n            window.addEventListener('resize', () => {\n                if (!bhRenderer || !bhCamera) return;\n                const w = container.clientWidth || window.innerWidth;\n                const h = container.clientHeight || window.innerHeight;\n                bhCamera.aspect = w / h;\n                bhCamera.updateProjectionMatrix();\n                bhRenderer.setSize(w, h);\n            });\n        }\n\n        let lastFrameTime = performance.now();\n        let fpsFrames = 0;\n        let fpsLastCheck = performance.now();\n\n        function animateBlackHole(now) {\n            requestAnimationFrame(animateBlackHole);\n\n            const dt = Math.min(0.05, (now - lastFrameTime) * 0.001);\n            lastFrameTime = now;\n\n            bhTime += dt * 0.025 * bhSpeed;\n\n            fpsFrames++;\n            if (now - fpsLastCheck >= 500) {\n                const fps = Math.round((fpsFrames * 1000) / (now - fpsLastCheck));\n                const fpsEl = document.getElementById('sim-fps-counter');\n                if (fpsEl) fpsEl.textContent = `${fps} FPS • GPU WebGL`;\n                fpsFrames = 0;\n                fpsLastCheck = now;\n            }\n\n            if (bhSolidMat && bhGlowMat) {\n                bhSolidMat.uniforms.uTime.value = bhTime;\n                bhSolidMat.uniforms.uLensStrength.value = bhLensStrength;\n\n                bhGlowMat.uniforms.uTime.value = bhTime;\n                bhGlowMat.uniforms.uLensStrength.value = bhLensStrength;\n            }\n\n            const targetCenter = new THREE.Vector3(0, 0, 0).add(camState.panOffset);\n            camState.lookAt.lerp(targetCenter, 0.12);\n\n            camState.radius += (camState.targetRadius - camState.radius) * 0.12;\n            camState.theta  += (camState.targetTheta  - camState.theta)  * 0.12;\n            camState.phi    += (camState.targetPhi    - camState.phi)    * 0.12;\n\n            const sinPhi = Math.sin(camState.phi);\n            bhCamera.position.set(\n                camState.lookAt.x + camState.radius * sinPhi * Math.sin(camState.theta),\n                camState.lookAt.y + camState.radius * Math.cos(camState.phi),\n                camState.lookAt.z + camState.radius * sinPhi * Math.cos(camState.theta)\n            );\n            bhCamera.lookAt(camState.lookAt);\n\n            bhRenderer.render(bhScene, bhCamera);\n        }\n\n        window.addEventListener('DOMContentLoaded', () => {\n            buildBlackHole(bhParticleCount);\n            lastFrameTime = performance.now();\n            fpsLastCheck = performance.now();\n            requestAnimationFrame(animateBlackHole);\n        });\n    <\/script>\n<\/body>\n<\/html>", "solar": "<!DOCTYPE html>\n<html lang=\"vi\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Mô Phỏn m\">Tỷ lệ khoảng cách thiên văn<\/span>\n                    <span id=\"sim-scale-val\" class=\"font-mono font-bold text-amber-300\">Quan sát rõ<\/span>\n                <\/div>\n                <input id=\"sim-scale-slider\" type=\"range\" min=\"0\" max=\"100\" step=\"1\" value=\"0\" class=\"cosmic-slider w-full\">\n                <div class=\"flex justify-between text-[10px] text-slate-400 mt-1\">\n                    <span>Quan sát chi tiết<\/span>\n                    <span>Khoảng cách thực AU<\/span>\n                <\/div>\n            <\/div>\n\n            <!-- Camera Focus Presets -->\n            <div class=\"pt-2 border-t border-slate-700/60\">\n                <div class=\"text-xs text-slate-300 font-medium mb-2\">Tiêu điểm Camera (Focus)<\/div>\n                <div class=\"grid grid-cols-2 gap-1.5\">\n                    <button onclick=\"focusSolarTarget('overview')\" data-focus=\"overview\" class=\"focus-btn col-span-2 text-left px-3 py-1.5 rounded-xl bg-cyan-500/25 border border-cyan-400/50 text-cyan-200 text-xs font-semibold transition cursor-pointer\">\n                        🌌 Toàn cảnh Hệ Mặt Trời\n                    <\/button>\n                    <button onclick=\"focusSolarTarget('sun')\" data-focus=\"sun\" class=\"focus-btn text-left px-2.5 py-1.5 rounded-xl bg-slate-800/75 hover:bg-slate-700/80 border border-slate-700 text-slate-200 text-xs transition cursor-pointer\">\n                        ☀️ Mặt Trời\n                    <\/button>\n                    <button onclick=\"focusSolarTarget('earth')\" data-focus=\"earth\" class=\"focus-btn text-left px-2.5 py-1.5 rounded-xl bg-slate-800/75 hover:bg-slate-700/80 border border-slate-700 text-slate-200 text-xs transition cursor-pointer\">\n                        🌍 Trái Đất & Trăng\n                    <\/button>\n                    <button onclick=\"focusSolarTarget('mars')\" data-focus=\"mars\" class=\"focus-btn text-left px-2.5 py-1.5 rounded-xl bg-slate-800/75 hover:bg-slate-700/80 border border-slate-700 text-slate-200 text-xs transition cursor-pointer\">\n                        🔴 Sao Hỏa\n                    <\/button>\n                    <button onclick=\"focusSolarTarget('asteroids')\" data-focus=\"asteroids\" class=\"focus-btn text-left px-2.5 py-1.5 rounded-xl bg-slate-800/75 hover:bg-slate-700/80 border border-slate-700 text-slate-200 text-xs transition cursor-pointer\">\n                        ☄️ Đai Tiểu Hành Tinh\n                    <\/button>\n                    <button onclick=\"focusSolarTarget('jupiter')\" data-focus=\"jupiter\" class=\"focus-btn text-left px-2.5 py-1.5 rounded-xl bg-slate-800/75 hover:bg-slate-700/80 border border-slate-700 text-slate-200 text-xs transition cursor-pointer\">\n                        🟠 Sao Mộc & 4 Trăng\n                    <\/button>\n                    <button onclick=\"focusSolarTarget('saturn')\" data-focus=\"saturn\" class=\"focus-btn text-left px-2.5 py-1.5 rounded-xl bg-slate-800/75 hover:bg-slate-700/80 border border-slate-700 text-slate-200 text-xs transition cursor-pointer\">\n                        🪐 Sao Thổ & Vành Đai\n                    <\/button>\n                    <button onclick=\"focusSolarTarget('uranus')\" data-focus=\"uranus\" class=\"focus-btn text-left px-2.5 py-1.5 rounded-xl bg-slate-800/75 hover:bg-slate-700/80 border border-slate-700 text-slate-200 text-xs transition cursor-pointer\">\n                        🔵 Sao Thiên Vương\n                    <\/button>\n                    <button onclick=\"focusSolarTarget('neptune')\" data-focus=\"neptune\" class=\"focus-btn text-left px-2.5 py-1.5 rounded-xl bg-slate-800/75 hover:bg-slate-700/80 border border-slate-700 text-slate-200 text-xs transition cursor-pointer\">\n                        🌀 Sao Hải Vương\n                    <\/button>\n                    <button onclick=\"focusSolarTarget('kuiper')\" data-focus=\"kuiper\" class=\"focus-btn col-span-2 text-left px-3 py-1.5 rounded-xl bg-slate-800/75 hover:bg-slate-700/80 border border-slate-700 text-slate-200 text-xs transition cursor-pointer\">\n                        ❄️ Vành đai Kuiper & Sao Diêm Vương\n                    <\/button>\n                    <button onclick=\"focusSolarTarget('ceres')\" data-focus=\"ceres\" class=\"focus-btn text-left px-2.5 py-1.5 rounded-xl bg-slate-800/75 hover:bg-slate-700/80 border border-slate-700 text-slate-200 text-xs transition cursor-pointer\">\n                        🪨 Tiểu hành tinh Ceres\n                    <\/button>\n                    <button onclick=\"focusSolarTarget('triton')\" data-focus=\"triton\" class=\"focus-btn text-left px-2.5 py-1.5 rounded-xl bg-slate-800/75 hover:bg-slate-700/80 border border-slate-700 text-slate-200 text-xs transition cursor-pointer\">\n                        🧊 Vệ tinh Triton\n                    <\/button>\n                <\/div>\n            <\/div>\n\n            <!-- Particle Allocation Breakdown -->\n            <div class=\"pt-2 border-t border-slate-700/60 text-[11px] text-slate-400 space-y-1\">\n                <div class=\"flex justify-between\"><span>• Mặt Trời (Lõi + Nhật hoa):<\/span><span id=\"bd-sun\" class=\"text-amber-300 font-mono\">190,000<\/span><\/div>\n                <div class=\"flex justify-between\"><span>• Hành tinh, Vệ tinh & Thiên thể:<\/span><span id=\"bd-planets\" class=\"text-cyan-300 font-mono\">465,000<\/span><\/div>\n                <div class=\"flex justify-between\"><span>• Vành đai Sao Thổ:<\/span><span id=\"bd-rings\" class=\"text-yellow-200 font-mono\">125,000<\/span><\/div>\n                <div class=\"flex justify-between\"><span>• Đai Tiểu Hành Tinh:<\/span><span id=\"bd-asteroids\" class=\"text-slate-200 font-mono\">95,000<\/span><\/div>\n                <div class=\"flex justify-between\"><span>• Vành đai Kuiper & Sao chổi:<\/span><span id=\"bd-kuiper\" class=\"text-indigo-300 font-mono\">90,000<\/span><\/div>\n                <div class=\"flex justify-between\"><span>• Quỹ đạo & Sao nền:<\/span><span id=\"bd-bg\" class=\"text-purple-300 font-mono\">35,000<\/span><\/div>\n            <\/div>\n        <\/div>\n    <\/aside>\n\n    <!-- Bottom Controls Hint -->\n    <footer class=\"fixed bottom-3 left-1/2 -translate-x-1/2 z-30 pointer-events-none\">\n        <div class=\"px-4 py-1.5 rounded-full bg-slate-950/75 border border-slate-800 text-[11px] text-slate-400 backdrop-blur-md whitespace-nowrap\">\n            Chuột trái: Xoay 360° • Lăn chuột / Chụm ngón: Zoom • Chuột phải: Di chuyển • Phím F: Toàn màn hình\n        <\/div>\n    <\/footer>\n\n    <!-- Toast Notification -->\n    <div id=\"toast-notification\" class=\"fixed bottom-14 right-4 z-50 glass-panel border-cyan-400/40 text-cyan-100 px-4 py-2.5 rounded-2xl shadow-2xl transform translate-x-full opacity-0 transition-all duration-300 flex items-center gap-2.5 text-xs\">\n        <span class=\"w-2 h-2 rounded-full bg-cyan-400\"><\/span>\n        <span id=\"toast-message\">Thông báo<\/span>\n    <\/div>\n\n    <script>\n        /* -----------------------------------------------------------\n           UI UTILITIES: TOAST, FULLSCREEN & DOWNLOAD\n        ----------------------------------------------------------- */\n        function showToast(message) {\n            const toast = document.getElementById('toast-notification');\n            const toastMsg = document.getElementById('toast-message');\n            if (!toast || !toastMsg) return;\n            toastMsg.textContent = message;\n            toast.classList.remove('translate-x-full', 'opacity-0');\n            setTimeout(() => {\n                toast.classList.add('translate-x-full', 'opacity-0');\n            }, 3000);\n        }\n\n        function toggleFullScreen() {\n            if (!document.fullscreenElement) {\n                document.documentElement.requestFullscreen().catch(() => {\n                    showToast('Trình duyệt không hỗ trợ chế độ toàn màn hình ở khung này.');\n                });\n            } else if (document.exitFullscreen) {\n                document.exitFullscreen();\n            }\n        }\n        document.getElementById('fullscreen-btn').addEventListener('click', toggleFullScreen);\n        document.addEventListener('keydown', (e) => {\n            if (e.key.toLowerCase() === 'f') toggleFullScreen();\n        });\n\n        document.getElementById('download-btn').addEventListener('click', () => {\n            try {\n                const htmlContent = '<!DOCTYPE html>\\n' + document.documentElement.outerHTML;\n                const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });\n                const url = URL.createObjectURL(blob);\n                const a = document.createElement('a');\n                a.href = url;\n                a.download = 'Mo_Phong_He_Mat_Troi_3D.html';\n                document.body.appendChild(a);\n                a.click();\n                document.body.removeChild(a);\n                URL.revokeObjectURL(url);\n                showToast('Đã tải xuống file solar_system_3d.html thành công!');\n            } catch (err) {\n                showToast('Không thể tải trực tiếp, hãy nhấn Ctrl+S để lưu trang.');\n            }\n        });\n\n        /* -----------------------------------------------------------\n           3D PARTICLE SOLAR SYSTEM ENGINE (THREE.JS + CUSTOM GLSL)\n        ----------------------------------------------------------- */\n        let simScene, simCamera, simRenderer, simStandardMaterial, simGlowMaterial;\n        let simPointsObjects = [];\n        let simParticleCount = 1000000;\n        let simTime = 0.35;\n        let simSpeed = 10.0;\n        let simScaleBlend = 0.0;\n        let simFocusTarget = 'overview';\n\n        const camState = {\n            theta: 0.55,\n            phi: 1.02,\n            radius: 175,\n            targetRadius: 175,\n            targetTheta: 0.55,\n            targetPhi: 1.02,\n            lookAt: new THREE.Vector3(0, 0, 0),\n            panOffset: new THREE.Vector3(0, 0, 0),\n            isDragging: false,\n            isPanning: false,\n            prevX: 0,\n            prevY: 0,\n            pinchDist: 0\n        };\n\n        const BODIES = [\n            { id: 0,  key: 'sun',     name: 'Mặt Trời (Sun)',          r: 5.4,  dObs: 0,     dAu: 0,      period: 1.0,     tilt: 7.25,  rot: 0.45,  inc: 0.0,  ecc: 0.0 },\n            { id: 1,  key: 'mercury', name: 'Sao Thủy (Mercury)',      r: 0.52, dObs: 16.5,  dAu: 15.0,   period: 0.2408,  tilt: 0.03,  rot: 0.15,  inc: 7.0,  ecc: 0.205 },\n            { id: 2,  key: 'venus',   name: 'Sao Kim (Venus)',         r: 0.88, dObs: 24.0,  dAu: 22.0,   period: 0.6152,  tilt: 177.3, rot: -0.08, inc: 3.39, ecc: 0.007 },\n            { id: 3,  key: 'earth',   name: 'Trái Đất (Earth)',        r: 1.02, dObs: 33.0,  dAu: 30.0,   period: 1.0000,  tilt: 23.44, rot: 2.4,   inc: 0.0,  ecc: 0.017 },\n            { id: 4,  key: 'moon',    name: 'Mặt Trăng (Moon)',        r: 0.28, dObs: 2.5,   dAu: 2.2,    period: 0.0748,  tilt: 6.68,  rot: 0.3,   inc: 5.14, ecc: 0.055, parent: 3 },\n            { id: 5,  key: 'mars',    name: 'Sao Hỏa (Mars)',          r: 0.70, dObs: 43.0,  dAu: 41.0,   period: 1.8808,  tilt: 25.19, rot: 2.2,   inc: 1.85, ecc: 0.093 },\n            { id: 6,  key: 'jupiter', name: 'Sao Mộc (Jupiter)',       r: 3.10, dObs: 68.0,  dAu: 105.0,  period: 11.862,  tilt: 3.13,  rot: 4.8,   inc: 1.30, ecc: 0.049 },\n            { id: 7,  key: 'io',      name: 'Vệ tinh Io',              r: 0.26, dObs: 4.5,   dAu: 4.5,    period: 0.00485, tilt: 0.0,   rot: 1.0,   inc: 0.05, ecc: 0.004, parent: 6 },\n            { id: 8,  key: 'europa',  name: 'Vệ tinh Europa',          r: 0.24, dObs: 5.5,   dAu: 5.5,    period: 0.00972, tilt: 0.0,   rot: 1.0,   inc: 0.47, ecc: 0.009, parent: 6 },\n            { id: 9,  key: 'ganymede',name: 'Vệ tinh Ganymede',        r: 0.34, dObs: 6.7,   dAu: 6.7,    period: 0.01959, tilt: 0.0,   rot: 1.0,   inc: 0.20, ecc: 0.001, parent: 6 },\n            { id: 10, key: 'callisto',name: 'Vệ tinh Callisto',        r: 0.31, dObs: 7.9,   dAu: 7.9,    period: 0.04569, tilt: 0.0,   rot: 1.0,   inc: 0.19, ecc: 0.007, parent: 6 },\n            { id: 11, key: 'saturn',  name: 'Sao Thổ (Saturn)',        r: 2.55, dObs: 96.0,  dAu: 185.0,  period: 29.457,  tilt: 26.73, rot: 4.2,   inc: 2.48, ecc: 0.056 },\n            { id: 12, key: 'titan',   name: 'Vệ tinh Titan',           r: 0.36, dObs: 7.8,   dAu: 7.8,    period: 0.04368, tilt: 0.3,   rot: 1.0,   inc: 0.35, ecc: 0.029, parent: 11 },\n            { id: 13, key: 'uranus',  name: 'Sao Thiên Vương (Uranus)',r: 1.62, dObs: 124.0, dAu: 340.0,  period: 84.011,  tilt: 97.77, rot: -2.8,  inc: 0.77, ecc: 0.046 },\n            { id: 14, key: 'neptune', name: 'Sao Hải Vương (Neptune)', r: 1.58, dObs: 150.0, dAu: 510.0,  period: 164.79,  tilt: 28.32, rot: 2.9,   inc: 1.77, ecc: 0.010 },\n            { id: 15, key: 'pluto',   name: 'Sao Diêm Vương (Pluto)',  r: 0.40, dObs: 174.0, dAu: 650.0,  period: 247.94,  tilt: 122.5, rot: -0.5,  inc: 17.16,ecc: 0.249 },\n            { id: 16, key: 'ceres',   name: 'Tiểu hành tinh Ceres',    r: 0.34, dObs: 54.5,  dAu: 68.0,   period: 4.60,    tilt: 4.0,   rot: 1.8,   inc: 10.6, ecc: 0.076 },\n            { id: 17, key: 'enceladus',name:'Vệ tinh Enceladus',       r: 0.20, dObs: 5.2,   dAu: 5.2,    period: 0.00375, tilt: 0.0,   rot: 1.2,   inc: 0.02, ecc: 0.004, parent: 11 },\n            { id: 18, key: 'triton',  name: 'Vệ tinh Triton',          r: 0.32, dObs: 4.7,   dAu: 4.7,    period: -0.0161, tilt: 0.0,   rot: -1.1,  inc: 23.0, ecc: 0.000, parent: 14 },\n            { id: 19, key: 'haumea',  name: 'Hành tinh lùn Haumea',    r: 0.31, dObs: 167.0, dAu: 605.0,  period: 283.8,   tilt: 28.0,  rot: 6.2,   inc: 28.2, ecc: 0.195 },\n            { id: 20, key: 'makemake',name: 'Hành tinh lùn Makemake',  r: 0.32, dObs: 182.0, dAu: 715.0,  period: 305.3,   tilt: 29.0,  rot: 0.9,   inc: 29.0, ecc: 0.158 },\n            { id: 21, key: 'comet',   name: 'Sao Chổi Halley-like',    r: 0.24, dObs: 82.0,  dAu: 270.0,  period: 75.3,    tilt: 18.0,  rot: 1.5,   inc: 16.5, ecc: 0.580 }\n        ];\n\n        const BODY_COUNT = BODIES.length;\n\n        function computeBodyPosition(body, t, scaleBlend, outVec) {\n            if (body.id === 0) {\n                outVec.set(0, 0, 0);\n                return outVec;\n            }\n            const dist = body.dObs * (1 - scaleBlend) + body.dAu * scaleBlend;\n            const meanAnomaly = (t / body.period) * Math.PI * 2.0 + body.id * 1.15;\n            const E = meanAnomaly + body.ecc * Math.sin(meanAnomaly);\n            const r = dist * (1.0 - body.ecc * Math.cos(E));\n            const angle = E;\n\n            const incRad = (body.inc * Math.PI) / 180.0;\n            const xLocal = Math.cos(angle) * r;\n            const zLocal = Math.sin(angle) * r;\n            const yLocal = Math.sin(angle) * r * Math.sin(incRad);\n\n            outVec.set(xLocal, yLocal, zLocal);\n\n            if (body.parent !== undefined) {\n                const parentBody = BODIES[body.parent];\n                const parentPos = computeBodyPosition(parentBody, t, scaleBlend, new THREE.Vector3());\n                outVec.add(parentPos);\n            }\n            return outVec;\n        }\n\n        document.getElementById('toggle-sim-panel-btn').addEventListener('click', () => {\n            const panel = document.getElementById('sim-control-panel');\n            const label = document.getElementById('toggle-sim-panel-text');\n            panel.classList.toggle('hidden');\n            label.textContent = panel.classList.contains('hidden') ? 'Mở Điều Khiển' : 'Thu Gọn';\n        });\n\n        const simSpeedSlider = document.getElementById('sim-speed-slider');\n        const simSpeedVal = document.getElementById('sim-speed-val');\n\n        function setSimSpeed(val) {\n            simSpeed = parseFloat(val);\n            if (simSpeedSlider) simSpeedSlider.value = simSpeed;\n            if (simSpeedVal) simSpeedVal.textContent = simSpeed === 0 ? 'Tạm dừng' : `${simSpeed}x`;\n        }\n        if (simSpeedSlider) {\n            simSpeedSlider.addEventListener('input', (e) => setSimSpeed(e.target.value));\n        }\n\n        const simScaleSlider = document.getElementById('sim-scale-slider');\n        const simScaleVal = document.getElementById('sim-scale-val');\n        if (simScaleSlider) {\n            simScaleSlider.addEventListener('input', (e) => {\n                simScaleBlend = parseFloat(e.target.value) / 100.0;\n                if (!simScaleVal) return;\n                if (simScaleBlend < 0.15) simScaleVal.textContent = 'Quan sát rõ';\n                else if (simScaleBlend > 0.85) simScaleVal.textContent = 'Chuẩn AU thực';\n                else simScaleVal.textContent = `Trung gian ${Math.round(simScaleBlend * 100)}%`;\n            });\n        }\n\n        function focusSolarTarget(targetKey) {\n            simFocusTarget = targetKey;\n            camState.panOffset.set(0, 0, 0);\n\n            const focusDistances = {\n                overview: { r: 175, phi: 1.02, label: `Toàn cảnh Hệ Mặt Trời (${simParticleCount.toLocaleString('en-US')} Hạt)` },\n                sun:      { r: 20,  phi: 1.25, label: 'Mặt Trời, Nhật Hoa & Vòng Từ Trường' },\n                earth:    { r: 6.0, phi: 1.25, label: 'Hệ Trái Đất & Mặt Trăng' },\n                mars:     { r: 4.6, phi: 1.25, label: 'Sao Hỏa (Hành tinh Đỏ)' },\n                asteroids:{ r: 92,  phi: 0.72, label: 'Vành Đai Tiểu Hành Tinh Chính' },\n                ceres:    { r: 4.0, phi: 1.18, label: 'Tiểu hành tinh lùn Ceres' },\n                jupiter:  { r: 13.0,phi: 1.22, label: 'Sao Mộc & Hệ Vệ Tinh' },\n                saturn:   { r: 14.5,phi: 1.12, label: 'Sao Thổ & Hệ Vành Đai' },\n                uranus:   { r: 10.0,phi: 1.15, label: 'Sao Thiên Vương' },\n                neptune:  { r: 10.0,phi: 1.15, label: 'Sao Hải Vương' },\n                triton:   { r: 3.8, phi: 1.20, label: 'Vệ tinh băng Triton' },\n                kuiper:   { r: 230, phi: 0.75, label: 'Vành Đai Kuiper & Sao Diêm Vương' }\n            };\n\n            const cfg = focusDistances[targetKey] || focusDistances.overview;\n            camState.targetRadius = cfg.r;\n            camState.targetPhi = cfg.phi;\n\n            const labelEl = document.getElementById('sim-target-label');\n            if (labelEl) labelEl.textContent = `Góc nhìn: ${cfg.label}`;\n\n            document.querySelectorAll('.focus-btn').forEach(btn => {\n                if (btn.getAttribute('data-focus') === targetKey) {\n                    btn.classList.remove('bg-slate-800/75', 'border-slate-700', 'text-slate-200');\n                    btn.classList.add('bg-cyan-500/25', 'border-cyan-400/50', 'text-cyan-200', 'font-semibold');\n                } else {\n                    btn.classList.remove('bg-cyan-500/25', 'border-cyan-400/50', 'text-cyan-200', 'font-semibold');\n                    btn.classList.add('bg-slate-800/75', 'border-slate-700', 'text-slate-200');\n                }\n            });\n        }\n\n        function updateParticleUI(totalCount) {\n            const badgeEl = document.getElementById('sim-particle-badge');\n            const labelEl = document.getElementById('sim-particle-label');\n            if (badgeEl) badgeEl.textContent = `${totalCount.toLocaleString('en-US')} Particles`;\n            if (labelEl) labelEl.textContent = totalCount.toLocaleString('en-US');\n\n            document.querySelectorAll('.pcount-btn').forEach(btn => {\n                const val = parseInt(btn.getAttribute('data-pcount'), 10);\n                btn.classList.remove(\n                    'bg-cyan-500/25', 'text-cyan-200', 'border-cyan-400/50', 'font-semibold',\n                    'bg-purple-500/25', 'text-purple-200', 'border-purple-400/50'\n                );\n                btn.classList.add('bg-slate-800/80', 'text-slate-300', 'border-slate-700');\n\n                if (val === totalCount) {\n                    if (val >= 2000000) {\n                        btn.classList.remove('bg-slate-800/80', 'text-slate-300', 'border-slate-700');\n                        btn.classList.add('bg-purple-500/25', 'text-purple-200', 'border-purple-400/50', 'font-semibold');\n                    } else {\n                        btn.classList.remove('bg-slate-800/80', 'text-slate-300', 'border-slate-700');\n                        btn.classList.add('bg-cyan-500/25', 'text-cyan-200', 'border-cyan-400/50', 'font-semibold');\n                    }\n                }\n            });\n\n            const ratio = totalCount / 1000000;\n            const sunN = Math.round(190000 * ratio);\n            const plN  = Math.round(465000 * ratio);\n            const rgN  = Math.round(125000 * ratio);\n            const asN  = Math.round(95000 * ratio);\n            const kpN  = Math.round(90000 * ratio);\n            const bgN  = Math.max(0, totalCount - (sunN + plN + rgN + asN + kpN));\n\n            const setText = (id, v) => {\n                const el = document.getElementById(id);\n                if (el) el.textContent = v.toLocaleString('en-US');\n            };\n            setText('bd-sun', sunN);\n            setText('bd-planets', plN);\n            setText('bd-rings', rgN);\n            setText('bd-asteroids', asN);\n            setText('bd-kuiper', kpN);\n            setText('bd-bg', bgN);\n        }\n\n        function setParticleCount(newCount) {\n            if (![250000, 500000, 1000000, 2000000].includes(newCount)) return;\n            simParticleCount = newCount;\n            updateParticleUI(simParticleCount);\n            buildSolarSystem(simParticleCount);\n            showToast(`Đã chuyển sang ${simParticleCount.toLocaleString('en-US')} hạt!`);\n        }\n\n        function clearSolarSystemObjects() {\n            if (simScene && simPointsObjects.length > 0) {\n                simPointsObjects.forEach(obj => {\n                    simScene.remove(obj.points);\n                    if (obj.geometry) obj.geometry.dispose();\n                    if (obj.material) obj.material.dispose();\n                });\n            }\n            simPointsObjects = [];\n        }\n\n        function buildSolarSystem(totalParticles) {\n            const container = document.getElementById('solar-webgl-container');\n            if (!container) return;\n\n            const width = container.clientWidth || window.innerWidth;\n            const height = container.clientHeight || window.innerHeight;\n\n            if (!simScene) {\n                simScene = new THREE.Scene();\n                simScene.background = new THREE.Color(0x02040a);\n            }\n\n            if (!simCamera) {\n                simCamera = new THREE.PerspectiveCamera(48, width / height, 0.1, 3500);\n            }\n\n            if (!simRenderer) {\n                simRenderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });\n                simRenderer.setSize(width, height);\n                const maxPr = totalParticles >= 2000000 ? 1.25 : 1.75;\n                simRenderer.setPixelRatio(Math.min(window.devicePixelRatio, maxPr));\n                container.innerHTML = '';\n                container.appendChild(simRenderer.domElement);\n                attachCameraControls(simRenderer.domElement, container);\n            } else {\n                const maxPr = totalParticles >= 2000000 ? 1.25 : 1.75;\n                simRenderer.setPixelRatio(Math.min(window.devicePixelRatio, maxPr));\n            }\n\n            clearSolarSystemObjects();\n            updateParticleUI(totalParticles);\n\n            const isExtended2M = totalParticles >= 2000000;\n            const scaleFactor = totalParticles / 1000000;\n\n            const ringReserve = Math.round(125000 * scaleFactor);\n            const STD_COUNT = Math.round(865000 * scaleFactor);\n            const GLW_COUNT = Math.max(8000, totalParticles - STD_COUNT);\n            const MAX_STD_BEFORE_RINGS = Mat \n    }\n    for (var f = 0; f < fillPts; f++) { var xx = R(x0, x1), rr = prof(xx), tt = R(0, TAU); if (rr > .004) sh.pt(xx, rr * Math.cos(tt), rr * Math.sin(tt), R(.7, 1.3), colFn ? colFn(xx, tt) : null); }\n    for (var j = 0; j < lonLines; j++) {\n      var th = j / lonLines * TAU, pv = null;\n      for (var i2 = 0; i2 < slices; i2++) { var x3 = x0 + (x1 - x0) * i2 / (slices - 1), r3 = prof(x3), q2 = [x3, r3 * Math.cos(th), r3 * Math.sin(th)]; if (pv && r3 > .004) sh.seg(pv, q2); pv = r3 > .004 ? q2 : null; }\n    }\n  }\n  function sphere(sh, r, ptsN, bands, latSeg, lonSeg, col) {\n    for (var i = 0; i < ptsN; i++) {\n      var u = Math.random() * 2 - 1;\n      if (Math.random() < .55) { var b = Math.round((u * .5 + .5) * bands) / bands; u = Math.max(-1, Math.min(1, (b * 2 - 1) + R(-.004, .004))); }\n      var t = R(0, TAU), s = Math.sqrt(1 - u * u); sh.pt(r * s * Math.cos(t), r * u, r * s * Math.sin(t), R(.8, 1.5), col);\n    }\n    for (var la = 1; la < 12; la++) { var uu = la / 12 * 2 - 1, ss = Math.sqrt(1 - uu * uu), prev = null; for (var k = 0; k <= latSeg; k++) { var tt = k / latSeg * TAU, q = [r * ss * Math.cos(tt), r * uu, r * ss * Math.sin(tt)]; if (prev) sh.seg(prev, q); prev = q; } }\n    for (var lo = 0; lo < 16; lo++) { var ph = lo / 16 * TAU, p2 = null; for (var k2 = 0; k2 <= lonSeg; k2++) { var al = -Math.PI / 2 + k2 / lonSeg * Math.PI, q2 = [r * Math.cos(al) * Math.cos(ph), r * Math.sin(al), r * Math.cos(al) * Math.sin(ph)]; if (p2) sh.seg(p2, q2); p2 = q2; } }\n  }\n  function circleY(sh, r, n, y) { var prev = null; for (var i = 0; i <= n; i++) { var t = i / n * TAU, q = [r * Math.cos(t), y || 0, r * Math.sin(t)]; if (prev) sh.seg(prev, q); prev = q; } }\n\n  function rotY(v, a) { var c = Math.cos(a), s = Math.sin(a); return [c * v[0] + s * v[2], v[1], -s * v[0] + c * v[2]]; }\n  function ellipse(sh, a, b, tilt, n) { var prev = null; for (var i = 0; i <= n; i++) { var t = i / n * TAU, q = rotXZ([a * Math.cos(t), 0, b * Math.sin(t)], tilt[0], tilt[1]); if (prev) sh.seg(prev, q); prev = q; } }\n  // gán chuyển động cho từng điểm theo vị trí của nó: f(x, y, z) trả về mảng thông số hoặc null\n  function tag(sh, f) {\n    var p0 = sh.pt, s0 = sh.seg;\n    sh.pt = function (x, y, z, s, c) { this.M = f(x, y, z); p0.call(this, x, y, z, s, c); };\n    sh.seg = function (a, b) { this.M = f((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, (a[2] + b[2]) / 2); s0.call(this, a, b); };\n  }\n\n\n  /* ---------- 1. Hành tinh có vành đai ---------- */\n  function planet() {\n    var sh = new Shape();\n    sh.part(\"Hành tinh\");\n    mot(sh, [0, .35, 1, 0, 0, 0, 0, 0], function () { sphere(sh, .62, K(30000), 24, 48, 24); });   // mặt cầu tự quay\n    sh.part(\"Vành đai\");\n    var radii = []; for (var r = .86; r < 1.78; r += .05) { if (r > 1.2 && r < 1.27) continue; radii.push(r); }\n    radii.forEach(function (rr, idx) {                                                              // mỗi vành quay theo định luật Kepler\n      mot(sh, [.55 * Math.pow(.9 / rr, 1.5), 0, 1, 0, 0, 0, 0, 0], function () {\n        var prev = null;\n        for (var i = 0; i < K(1100); i++) { var t = R(0, TAU); sh.pt(rr * Math.cos(t), R(-.004, .004), rr * Math.sin(t), R(.7, 1.6)); }\n        for (var k = 0; k <= 72; k++) { var tt = k / 72 * TAU, q = [rr * Math.cos(tt), 0, rr * Math.sin(tt)]; if (prev && idx % 2 === 0) sh.seg(prev, q); prev = q; }\n      });\n    });\n    sh.part(\"Bụi vành đai\");\n    for (var d = 0; d < K(14000); d++) { var rr2 = R(.86, 1.8); sh.M = [.55 * Math.pow(.9 / rr2, 1.5), 0, 1, 0, 0, 0, 0, 0]; var t2 = R(0, TAU); sh.pt(rr2 * Math.cos(t2), R(-.025, .025), rr2 * Math.sin(t2), R(.5, 1.1)); }\n    sh.part(\"Ba mặt trăng\");\n    sh.M = null; circleY(sh, 2.1, 140); circleY(sh, 1.9, 140); circleY(sh, 2.3, 140);\n    [[2.1, .22, 1.0], [1.9, .3, 3.2], [2.3, .18, 5.0]].forEach(function (m) {                     // ba mặt trăng quay quanh hành tinh\n      mot(sh, [m[1], 0, 1, 0, 0, 0, 0, 0], function () {\n        var c = [m[0] * Math.c
