<style>
/* Bố cục: nền tối. Cửa sổ code ở bên trái chạy đúng đoạn mã đang dựng hình, bảng log bên phải, hạt sáng ở giữa, chữ nhỏ ở các góc. */
@property --tint { syntax: "<color>"; inherits: false; initial-value: #0a1226; }
:root {
  --void: #03050c;
  --ice: #9fd4ff;
  --cyan: #3fb8ff;
  --amber: #ffb86b;
  --ink: #e8f1ff;
  --dim: #6f87a8;
  --code: rgba(125, 165, 225, .3);
  --code-done: rgba(170, 205, 255, .62);
  --font-display: "Space Grotesk", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--void); color: var(--ink); font-family: var(--font-display); overflow: hidden; -webkit-tap-highlight-color: transparent; }
.stage {
  position: fixed; inset: 0; --tint: #0a1226; transition: --tint 1.8s ease;
  background: radial-gradient(120% 90% at 50% 45%, var(--tint) 0%, #050812 52%, #02030a 100%);
}
.stage::after { content: ""; position: absolute; inset: auto 0 0 0; height: 36%; pointer-events: none; background: linear-gradient(to top, rgba(3,5,12,.85), rgba(3,5,12,0)); }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; opacity: 0; transition: opacity 1.2s ease; }
canvas.ready { opacity: 1; }
canvas.drag { cursor: grabbing; }

/* ---- Cửa sổ code ---- */
.editor {
  position: absolute; left: max(18px, env(safe-area-inset-left, 0px)); top: 13%; bottom: 25%; width: min(46vw, 620px); pointer-events: none;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 12%, #000 88%, transparent 100%);
  mask-image: linear-gradient(to bottom, transparent 0, #000 12%, #000 88%, transparent 100%);
  transition: opacity .5s; overflow: hidden;
}
.editor.off, .console.off { opacity: 0; }
.ed-in { font: 400 12.5px/1.65 var(--font-mono); transition: transform .55s cubic-bezier(.22, 1, .36, 1); will-change: transform; }
.ln { display: flex; gap: 16px; white-space: pre; color: var(--code); padding-right: 8px; animation: lnIn .45s both; animation-delay: calc(var(--i) * 16ms); }
.ln .no { flex: none; width: 2ch; text-align: right; color: rgba(110, 135, 170, .35); font-weight: 400; }
.ln.done { color: var(--code-done); }
.ln.act { color: #fff; background: linear-gradient(90deg, rgba(63, 184, 255, .22), rgba(63, 184, 255, 0) 90%); box-shadow: inset 2px 0 0 var(--cyan); }
.ln.act .no { color: var(--cyan); }
.ln .k { color: #7ea6ff; } .ln .n { color: #ffb86b; } .ln .s { color: #7fe0c8; } .ln .c { color: #6c7f9c; font-style: italic; } .ln .f { color: #cfe2ff; }
.ln:not(.done):not(.act) .k, .ln:not(.done):not(.act) .n, .ln:not(.done):not(.act) .s, .ln:not(.done):not(.act) .f { opacity: .55; }
@keyframes lnIn { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }

/* ---- Bảng log ---- */
.console {
  position: absolute; right: max(18px, env(safe-area-inset-right, 0px)); top: 15%; width: min(25vw, 330px); pointer-events: none;
  font: 400 11.5px/1.6 var(--font-mono); color: var(--dim); transition: opacity .5s;
}
.con-head { color: var(--ice); margin-bottom: 8px; }
.con-lines { display: flex; flex-direction: column; gap: 1px; min-height: 12.6em; }
.con-lines div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; animation: lnIn .3s both; }
.con-lines div:nth-last-child(n+7) { opacity: .45; } .con-lines div:nth-last-child(n+9) { opacity: .22; }
.con-lines b { color: #7fe0c8; font-weight: 500; }
.con-foot { margin-top: 10px; color: var(--ice); }
.con-bar { height: 2px; margin-top: 8px; background: rgba(159, 212, 255, .14); overflow: hidden; }
.con-bar i { display: block; height: 100%; width: 0; background: var(--cyan); }
@media (max-width: 860px) {
  .editor { width: calc(100% - 36px); top: 11%; bottom: 52%; opacity: .6; }
  .console { display: none; }
}

/* ---- Chữ trên màn hình ---- */
.ui {
  position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
  padding-block: max(18px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-bottom, 0px));
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
}
.top, .bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.top { align-items: flex-start; }
.brand { font: 500 12px/1.4 var(--font-mono); letter-spacing: .28em; text-transform: uppercase; color: var(--ice); }
.brand small { display: block; margin-top: 4px; letter-spacing: .1em; text-transform: none; color: var(--dim); font-size: 11px; }
.name { min-width: 0; max-width: min(640px, 100%); }
.name h1 { margin: 0; font: 500 clamp(22px, 4.2vw, 40px)/1.1 var(--font-display); letter-spacing: -.01em; text-wrap: balance; transition: opacity .35s; }
.name p { margin: 8px 0 0; font: 400 12px/1.55 var(--font-mono); color: var(--dim); transition: opacity .35s; max-width: 60ch; }
.dots { display: flex; gap: 7px; margin-top: 14px; pointer-events: auto; }
.dots button { all: unset; box-sizing: border-box; width: 22px; height: 18px; display: grid; align-items: center; cursor: pointer; }
.dots button::before { content: ""; height: 2px; background: rgba(159, 212, 255, .22); transition: background .4s, height .3s; }
.dots button.on::before { background: var(--cyan); height: 3px; }
.dots button:hover::before { background: var(--ice); }
.dots button:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
.ctl { display: flex; gap: 8px; pointer-events: auto; flex-wrap: wrap; justify-content: flex-end; }
.ctl button, .ctl .hint {
  font: 500 12px/1 var(--font-mono); color: var(--ice); background: rgba(8, 16, 36, .55);
  border: 1px solid rgba(159, 212, 255, .25); border-radius: 999px; padding: 10px 14px; cursor: pointer;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition: border-color .2s, color .2s;
}
.ctl button:hover { border-color: var(--cyan); color: #fff; }
.ctl button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.ctl button[aria-pressed="false"] { color: var(--dim); }
.ctl button#bMotion[aria-pressed="true"] { border-color: var(--cyan); color: #fff; background: rgba(63, 184, 255, .22); }
.hint { pointer-events: none; cursor: default; color: var(--dim) !important; border-color: transparent !important; background: none !important; backdrop-filter: none !important; }
@media (max-width: 600px) { .hint { display: none; } }

/* ---- Điện tâm đồ và menu trái tim ---- */
.ecg { position: fixed; top: max(14px, env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); width: min(42vw, 480px); pointer-events: none; z-index: 3; }
.ecg-top { display: flex; justify-content: space-between; font: 400 11.5px/1.4 var(--font-mono); color: var(--dim); }
.ecg-top b { font: 500 30px/1 var(--font-display); color: #ff8fb0; letter-spacing: -.02em; margin-right: 2px; }
.ecg canvas { display: block; width: 100%; height: 84px; cursor: default; opacity: 1; }
.hmenu {
  position: fixed; right: max(18px, env(safe-area-inset-right, 0px)); bottom: max(74px, calc(env(safe-area-inset-bottom, 0px) + 66px)); width: min(340px, calc(100vw - 36px)); z-index: 5;
  display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 16px; background: rgba(8, 14, 30, .84); border: 1px solid rgba(255, 130, 170, .28);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 18px 50px rgba(0, 0, 0, .5);
}
.hm-head { display: flex; justify-content: space-between; align-items: center; font: 500 14px/1 var(--font-display); }
.hm-head button, .hm-chips button, .hm-tog button { font: 500 12px/1 var(--font-mono); color: var(--ice); background: rgba(159, 212, 255, .08); border: 1px solid rgba(159, 212, 255, .22); border-radius: 999px; padding: 8px 12px; cursor: pointer; }
.hmenu label, .hm-lab { font: 400 11.5px/1.4 var(--font-mono); color: var(--dim); }
.hmenu input[type="text"] { font: 500 15px/1.2 var(--font-display); color: #fff; background: rgba(255, 255, 255, .06); border: 1px solid rgba(159, 212, 255, .28); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0; }
.hmenu input[type="text"]:focus { outline: 2px solid #ff8fb0; outline-offset: 1px; }
.hmenu input[type="range"] { width: 100%; accent-color: #ff6f9c; }
.hm-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.hm-row span { font: 400 11.5px/1 var(--font-mono); color: var(--ice); } .hm-row output { font: 500 18px/1 var(--font-display); color: #ff8fb0; }
.hm-chips, .hm-tog { display: flex; flex-wrap: wrap; gap: 6px; }
.hm-chips button[aria-pressed="true"], .hm-tog button[aria-pressed="true"] { background: rgba(255, 111, 156, .22); border-color: #ff6f9c; color: #fff; }
.hm-note { margin: 0; font: 400 11.5px/1.5 var(--font-mono); color: var(--dim); min-height: 3em; }
.hmenu button:hover { border-color: #ff8fb0; } .hmenu button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
@media (max-width: 860px) { .ecg { width: calc(100% - 36px); top: 52px; } .hmenu { bottom: 128px; } }
@media (prefers-reduced-motion: reduce) { .ln { animation: none; } .ed-in { transition: none; } }
</style>

</div>

  var D = 2, N = 200000, CNT = 200000, NL = 24000, HRES = 20000, HN = 120000, TAU = Math.PI * 2;

  // chữ 3D: vẽ chữ ra ảnh, lấy mẫu điểm ảnh rồi đùn thành khối dày nhiều lớp nằm giữa lòng quả tim (không dán lên bề mặt)

  }

  var textTimer = 0; hmText.addEventListener("input", function () { clearTimeout(textTimer); textTimer = setTimeout(function () { setHeartText(hmText.value.trim()); }, 260); });
  setMode("normal");
  var bMotion = document.getElementById("bMotion");
  bMotion.addEventListener("click", function () { motionOn = !motionOn; bMotion.setAttribute("aria-pressed", String(motionOn)); });

  startMorph(1);
  // dựng sẵn hình kế tiếp lúc máy rảnh (mỗi lần một hình) để chuyển hình không bị khựng
  function warm() { var k = nextOf(cur); if (!shapes[k]) { if (state === "hold" && T - lastAct > 1) getShape(k); } else { for (var j = 1; j <= NS; j++) if (!shapes[j]) { if (state === "hold" && T - lastAct > 1) getShape(j); break; } } }

  /* ================= Tương tác chậm và mượt ================= */
  var tuy = 0, tup = .0, uy = 0, up = 0, tz = 1, zz = 1, auto_y = 0, dragging = false, lx = 0, ly = 0, lastAct = -99, T = 0;

      mixT += dt / DUR; var p = Math.min(mixT, 1); U.uMix.value = p;

      if (mixT >= 1) { runTo(cnt - 1); cur = nxt; bind(cur, cur); U.uMix.value = 0; state = "hold"; holdT = 0; if (cur === HI && !hmOpened) { hmOpened = true; openMenu(true); } conPts.textContent = META[cur].n.toLocaleString("vi-VN"); conBar.style.width = "100%"; }

    }
