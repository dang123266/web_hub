<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quỹ đạo</title>
<meta name="description" content="Mô phỏng hạt sáng GPU: hố đen, Hệ Mặt Trời, hành tinh có vành đai, trạm ISS, Starship, Saturn V, kính James Webb, thiên hà và Sputnik 1. Mỗi hình có bảng điều khiển tốc độ, số hạt tới 2 triệu, bung bộ phận và tiêu điểm camera.">
<style>
  html, body { margin: 0; height: 100%; background: #02040a; color: #e2e8f0; font-family: Inter, system-ui, sans-serif; overflow: hidden; }
  nav { position: fixed; inset: 0 0 auto 0; height: 46px; display: flex; align-items: center; gap: 6px; padding: 0 12px; background: rgba(6, 9, 20, .96); border-bottom: 1px solid rgba(148, 163, 184, .18); z-index: 5; overflow-x: auto; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  nav b { font: 700 13px "Space Grotesk", Inter, sans-serif; letter-spacing: .18em; text-transform: uppercase; color: #9fd4ff; margin-right: 8px; white-space: nowrap; }
  nav button { flex: none; font: 600 12px Inter, system-ui, sans-serif; color: #cbd5e1; background: rgba(30, 41, 59, .7); border: 1px solid #334155; border-radius: 999px; padding: 6px 12px; cursor: pointer; transition: .15s; }
  nav button:hover { border-color: #64748b; color: #fff; }
  nav button[aria-current="true"] { color: #fff; background: rgba(56, 189, 248, .22); border-color: rgba(56, 189, 248, .6); }
  iframe { position: fixed; inset: 46px 0 0 0; width: 100%; height: calc(100% - 46px); border: 0; background: #02040a; }
</style>
</head>
<body>
<nav id="nav"><b>Quỹ đạo</b></nav>
<iframe id="view" title="Mô phỏng hạt" allow="fullscreen" allowfullscreen></iframe>
<script>
  var PAGES = [["black_hole", "Hố đen", "black_hole.html"], ["solar", "Hệ Mặt Trời", "solar_system.html"], ["planet", "Hành tinh", "planet.html"], ["iss", "Trạm ISS", "iss.html"], ["starship", "Starship", "starship.html"], ["saturnv", "Saturn V", "saturnv.html"], ["jwst", "James Webb", "jwst.html"], ["galaxy", "Thiên hà", "galaxy.html"], ["sputnik", "Sputnik 1", "sputnik.html"]];
  var nav = document.getElementById("nav"), view = document.getElementById("view");
  function show(id) {
    var p = PAGES.filter(function (x) { return x[0] === id; })[0] || PAGES[0];
    view.src = p[2]; try { history.replaceState(null, "", "#" + p[0]); } catch (e) { location.hash = p[0]; }
    [].forEach.call(nav.querySelectorAll("button"), function (b) { b.setAttribute("aria-current", String(b.dataset.id === p[0])); });
    document.title = "Quỹ đạo · " + p[1];
  }
  PAGES.forEach(function (p) { var b = document.createElement("button"); b.type = "button"; b.dataset.id = p[0]; b.textContent = p[1]; b.addEventListener("click", function () { show(p[0]); }); nav.appendChild(b); });
  window.addEventListener("hashchange", function () { show(location.hash.slice(1)); });
  show(location.hash.slice(1));
</script>
</body>
</html>
